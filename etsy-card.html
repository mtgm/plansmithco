<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSmithCo - Product Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 2000px;
            height: 2000px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 40px;
            padding: 80px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Product Title */
        .product-title {
            text-align: center;
            font-size: 72px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 60px;
            letter-spacing: -1px;
        }

        /* QR Code Area - Yellow Background */
        .qr-area {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 32px;
            padding: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .qr-code-wrapper {
            background: white;
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        #qr-code {
            width: 600px;
            height: 600px;
        }

        #qr-code img {
            width: 100% !important;
            height: 100% !important;
            border-radius: 12px;
        }

        .scan-instruction {
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 56px;
            font-weight: 700;
            color: #78350f;
        }

        .scan-icon {
            font-size: 80px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        /* How to Use Section */
        .how-to-use {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 60px;
        }

        .how-to-title {
            font-size: 48px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(255, 255, 255, 0.08);
            padding: 30px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .step-number {
            width: 80px;
            height: 80px;
            background: #f59e0b;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-text {
            font-size: 42px;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.4;
        }

        /* Branding Footer */
        .brand-footer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="card-container">
        <h1 class="product-title" id="product-name">Loading Product...</h1>

        <div class="qr-area">
            <div class="qr-code-wrapper">
                <div id="qr-code"></div>
            </div>
            <div class="scan-instruction">
                <span class="scan-icon">📱</span>
                <span>View on your space</span>
            </div>
        </div>

        <div class="how-to-use">
            <h2 class="how-to-title">HOW TO USE</h2>
            <div class="steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-text">Scan QR code with your phone</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-text">Allow camera access</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-text">Place product in your space</div>
                </div>
            </div>
        </div>

        <div class="brand-footer">PlanSmithCo</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                sku: params.get('sku'),
                name: params.get('name')
            };
        }

        // Initialize card
        async function init() {
            const { sku, name } = getUrlParams();

            if (!sku) {
                console.error('No SKU provided');
                return;
            }

            // Set product name
            if (name) {
                document.getElementById('product-name').textContent = decodeURIComponent(name);
            } else {
                // Try to fetch from products.json
                try {
                    const response = await fetch('/products.json');
                    const data = await response.json();
                    let foundProduct = null;

                    for (const cat of data) {
                        const p = cat.products.find(x => x && x.sku && x.sku.toString() === sku.toString());
                        if (p) {
                            foundProduct = p;
                            break;
                        }
                    }

                    if (foundProduct) {
                        document.getElementById('product-name').textContent = foundProduct.name;
                    }
                } catch (e) {
                    console.error('Error loading product data:', e);
                }
            }

            // Generate QR code pointing to mobile AR view
            const baseUrl = window.location.origin + '/m/ar-view.html';
            const qrUrl = `${baseUrl}?sku=${sku}`;

            const qrContainer = document.getElementById('qr-code');
            new QRCode(qrContainer, {
                text: qrUrl,
                width: 600,
                height: 600,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H // High error correction for better scanning
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
