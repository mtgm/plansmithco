<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSmithCoDIY - Product Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 0;
            width: 2000px;
            height: 2000px;
        }

        .card-container {
            width: 2000px;
            height: 2000px;
            background: #ffffff;
            padding: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Main Content Box */
        .content-box {
            background: #ffffff;
            padding: 60px;
            margin: 0px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            flex: 1;
        }

        /* Top Header Bar */
        .header-bar {
            background: #f59e0b;
            border-radius: 20px;
            padding: 28px 50px;
            text-align: center;
        }

        .header-text {
            font-size: 64px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0px;
        }

        /* QR Code Area */
        .qr-area {
            background: #f8fafc;
            border-radius: 32px;
            padding: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
        }

        .qr-code-wrapper {
            background: #ffffff;
            padding: 45px;
            border-radius: 24px;
            margin-bottom: 40px;
            border: 1px solid #e2e8f0;
        }

        #qr-code {
            width: 600px;
            height: 600px;
        }

        #qr-code img {
            width: 100% !important;
            height: 100% !important;
            border-radius: 8px;
        }

        .scan-instruction {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 52px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 15px;
        }

        .scan-icon {
            font-size: 72px;
        }

        .scan-subtext {
            font-size: 36px;
            font-weight: 500;
            color: #94a3b8;
            text-align: center;
            line-height: 1.4;
            max-width: 900px;
        }

        /* How to Use Section */
        .how-to-use {
            background: #ffffff;
            border-radius: 28px;
            padding: 45px 55px;
            border: 1px solid #e2e8f0;
        }

        .how-to-title {
            font-size: 48px;
            font-weight: 800;
            color: #f59e0b;
            margin-bottom: 35px;
            text-align: center;
            letter-spacing: 2px;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 28px;
            background: #f8fafc;
            padding: 25px 35px;
            border-radius: 18px;
            border: 2px solid #e2e8f0;
        }

        .step-number {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .step-text {
            font-size: 38px;
            font-weight: 700;
            color: #475569;
            line-height: 1.4;
        }

        /* Etsy Link Footer */
        .etsy-footer {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            padding: 20px 35px;
            text-align: center;
        }

        .etsy-link {
            font-size: 28px;
            font-weight: 700;
            color: #64748b;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .etsy-label {
            color: #f59e0b;
            font-weight: 800;
        }
    </style>
</head>

<body>
    <div class="card-container">
        <div class="content-box">
            <!-- Top Header Bar -->
            <div class="header-bar">
                <div class="header-text">View in Augmented Reality (AR)</div>
            </div>

            <!-- QR Code Area -->
            <div class="qr-area">
                <div class="qr-code-wrapper">
                    <div id="qr-code"></div>
                </div>
                <div class="scan-instruction">
                    <span class="scan-icon">📱</span>
                    <span id="scan-description">Scan to preview the finished rack in your garage or workshop.</span>
                </div>
            </div>

            <!-- How to Use Section -->
            <div class="how-to-use">
                <h2 class="how-to-title">HOW TO USE</h2>
                <div class="steps">
                    <div class="step">
                        <div class="step-number">1</div>
                        <div class="step-text">Scan QR code with your phone</div>
                    </div>
                    <div class="step">
                        <div class="step-number">2</div>
                        <div class="step-text">Allow camera access</div>
                    </div>
                    <div class="step">
                        <div class="step-number">3</div>
                        <div class="step-text">Place product in your space</div>
                    </div>
                </div>
            </div>

            <!-- Etsy Shop Link -->
            <div class="etsy-footer">
                <span class="etsy-link">
                    <span class="etsy-label">Etsy:</span> https://www.etsy.com/shop/PlanSmithCoDIY
                </span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                sku: params.get('sku'),
                name: params.get('name'),
                description: params.get('description')
            };
        }

        // Initialize card
        async function init() {
            const { sku, name, description } = getUrlParams();

            if (!sku) {
                console.error('No SKU provided');
                return;
            }

            // Set custom description if provided
            if (description) {
                document.getElementById('scan-description').textContent = decodeURIComponent(description);
            }

            // Generate QR code pointing to mobile AR view
            const baseUrl = window.location.origin + '/m/ar-view.html';
            const qrUrl = `${baseUrl}?sku=${sku}`;

            const qrContainer = document.getElementById('qr-code');
            new QRCode(qrContainer, {
                text: qrUrl,
                width: 600,
                height: 600,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
